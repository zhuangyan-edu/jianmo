<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色转台</title>
<style>
html,body{margin:0;height:100%;background:#1b1e26;overflow:hidden}canvas{display:block;width:100%;height:100%}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
#bar button{font:14px/1 system-ui,sans-serif;color:#e8ecf3;background:rgba(20,24,32,.72);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:10px 16px;cursor:pointer}
#bar button[aria-pressed=true]{background:#dfe8f7;color:#141820;border-color:#dfe8f7}
#bar button:focus-visible{outline:2px solid #8fc8ff;outline-offset:2px}
</style>
<canvas id="gl"></canvas>
<div id="bar">
  <button id="b-look" type="button">最终光照</button>
  <button id="b-glow" type="button">眼睛发光</button>
  <button id="b-spark" type="button">电光</button>
  <button id="b-spin" type="button">转台</button>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildHair } from './hair.js';
import { createLook } from './look.js';

const Q = new URLSearchParams(location.search);
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8a8f98);
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
const controls = new OrbitControls(camera, canvas);
// look=final (default): backlit rig with rim light, skin translucency, eye glow and bloom (look.js).  look=flat: plain even light for checking the models.
const look = createLook(THREE, renderer, scene, camera, Q);
const sun = look.sun;

const load = url => new Promise((ok, bad) => new GLTFLoader().load(url, ok, undefined, bad));
// head=head (default): the scan with its own messy hair, used as is.  head=bald: clean bald scan (kept for comparison),
// with hair=code (procedural hair grown on it) or hair=wig (the wig model).
const HEAD_SRC = Q.get('head') || 'head', HAIR = Q.get('hair') || 'code', useWig = HEAD_SRC === 'bald' && HAIR === 'wig';
const [bodyG, headG, wigG] = await Promise.all([load('../assets/body.glb'), load(`../assets/${HEAD_SRC}.glb`), useWig ? load('../assets/wig.glb') : null]);

// ---- body: drop the low-detail head and hair, keep everything below the neck
const body = bodyG.scene; scene.add(body); body.updateMatrixWorld(true);
let skinned; body.traverse(o => { if (o.isSkinnedMesh) skinned = o; });
skinned.frustumCulled = false;
const bones = skinned.skeleton.bones, bone = n => bones.find(b => b.name.endsWith(n));
const NECK_FULL_W = +(Q.get('nfw') ?? 0.75), NECK_FULL_Y = +(Q.get('nfy') ?? 0.83);   // triangles this strongly bound to neck/head, above this height, are neck skin for sure
const NECK_PAINT_Y = 0.785;   // bind-pose height above which exposed body skin is repainted (just above the tie knot)
const headBone = bone('Head'), headIdx = bones.indexOf(headBone);
{
  const g = skinned.geometry, si = g.attributes.skinIndex, sw = g.attributes.skinWeight, idx = g.index.array;
  const hw = new Float32Array(si.count);
  for (let i = 0; i < si.count; i++) for (let k = 0; k < 4; k++) if (si.getComponent(i, k) === headIdx) hw[i] += sw.getComponent(i, k);
  const thr = +(Q.get('cut') ?? 0.5), keep = [];
  for (let i = 0; i < idx.length; i += 3) if (Math.max(hw[idx[i]], hw[idx[i + 1]], hw[idx[i + 2]]) <= thr) keep.push(idx[i], idx[i + 1], idx[i + 2]);
  if (Q.get('mode') !== 'body') g.setIndex(keep);
}

// The body's neck and upper chest still carry dark smears baked in from the old hair.
// Repaint every non-white texel (i.e. not shirt collar) of that region with a flat skin tone.
const SKIN = [236, 200, 194];
{
  const g = skinned.geometry, P = g.attributes.position, U = g.attributes.uv, idx = g.index.array, mat = skinned.material;
  const si = g.attributes.skinIndex, sw = g.attributes.skinWeight, neckIdx = bones.indexOf(bone('Neck')), nw = new Float32Array(P.count);
  for (let i = 0; i < P.count; i++) for (let k = 0; k < 4; k++) { const b = si.getComponent(i, k); if (b === neckIdx || b === headIdx) nw[i] += sw.getComponent(i, k); }
  const img = mat.map.image, W = img.width, H = img.height;
  const tex = document.createElement('canvas'); tex.width = W; tex.height = H;
  const tc = tex.getContext('2d', { willReadFrequently: true }); tc.drawImage(img, 0, 0);
  const mask = document.createElement('canvas'); mask.width = W; mask.height = H;
  const mc = mask.getContext('2d', { willReadFrequently: true }); mc.fillStyle = '#fff'; mc.strokeStyle = '#fff'; mc.lineWidth = 3;
  const mask2 = document.createElement('canvas'); mask2.width = W; mask2.height = H;   // triangles that are neck proper: repaint fully
  const m2 = mask2.getContext('2d', { willReadFrequently: true }); m2.fillStyle = '#fff'; m2.strokeStyle = '#fff'; m2.lineWidth = 3;
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let i = 0; i < idx.length; i += 3) {
    const t = [idx[i], idx[i + 1], idx[i + 2]];
    const cy = (P.getY(t[0]) + P.getY(t[1]) + P.getY(t[2])) / 3, cx = (P.getX(t[0]) + P.getX(t[1]) + P.getX(t[2])) / 3;
    if (cy < NECK_PAINT_Y || Math.abs(cx) > 0.07) continue;
    mc.beginPath();
    t.forEach((v, k) => { const x = U.getX(v) * W, y = U.getY(v) * H; k ? mc.lineTo(x, y) : mc.moveTo(x, y); x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
    mc.closePath(); mc.fill(); mc.stroke();
    if (Math.min(nw[t[0]], nw[t[1]], nw[t[2]]) > NECK_FULL_W && cy > NECK_FULL_Y) { m2.beginPath(); t.forEach((v, k) => { const x = U.getX(v) * W, y = U.getY(v) * H; k ? m2.lineTo(x, y) : m2.moveTo(x, y); }); m2.closePath(); m2.fill(); m2.stroke(); }
  }
  x0 = Math.max(0, Math.floor(x0) - 2); y0 = Math.max(0, Math.floor(y0) - 2); x1 = Math.min(W, Math.ceil(x1) + 2); y1 = Math.min(H, Math.ceil(y1) + 2);
  if (x1 > x0 && y1 > y0) {
    const m = mc.getImageData(x0, y0, x1 - x0, y1 - y0).data, mm = m2.getImageData(x0, y0, x1 - x0, y1 - y0).data, d = tc.getImageData(x0, y0, x1 - x0, y1 - y0);
    for (let k = 0; k < m.length; k += 4) {
      if (m[k] < 128) continue;
      const r = d.data[k], gg = d.data[k + 1], b = d.data[k + 2], white = mm[k] < 128 && Math.min(r, gg, b) > 180 && Math.max(r, gg, b) - Math.min(r, gg, b) < 22;
      if (!white) { d.data[k] = SKIN[0]; d.data[k + 1] = SKIN[1]; d.data[k + 2] = SKIN[2]; }
    }
    tc.putImageData(d, x0, y0);
    const nt = new THREE.CanvasTexture(tex); nt.flipY = mat.map.flipY; nt.colorSpace = mat.map.colorSpace; nt.wrapS = mat.map.wrapS; nt.wrapT = mat.map.wrapT; nt.anisotropy = 8;
    mat.map = nt; mat.needsUpdate = true;
  }
}

// ---- head: align the scanned head to the head bone
const head = headG.scene, pivot = new THREE.Group();
pivot.add(head);
// The scan is exported tilted. These were measured on assets/head.glb (tools/analyse-head.js):
// the two eye centres and the average skin normal around them, in the scan's own coordinates.
const SCANS = {
  head: { eyeR: [0.1099, 0.3185, 0.3179], eyeL: [0.2628, 0.3006, 0.2335], forward: [0.1755, -0.1532, 0.5167] },
  bald: { eyeR: [0.0072, 0.4808, 0.2885], eyeL: [0.2193, 0.4418, 0.1792], forward: [0.3450, -0.1381, 0.6923] },
};
const SCAN = SCANS[HEAD_SRC];
// Where the eyes should sit on the rigged body (bind pose, world units) and how far apart.
const HEAD = { eyeY: 0.897, eyeZ: 0.062, eyeGap: 0.042, pitch: 0, yaw: 0, roll: 0 };
const NECK_KEEP = +(Q.get('nk') ?? 0.55);   // how far below the chin the scan's neck is kept, in eye-gap units
const bindHeadInv = headBone.matrixWorld.clone().invert();
function setHead(o) {
  Object.assign(HEAD, o);
  const f = new THREE.Vector3(...SCAN.forward).normalize();
  const eR = new THREE.Vector3(...SCAN.eyeR), eL = new THREE.Vector3(...SCAN.eyeL), mid = eR.clone().add(eL).multiplyScalar(0.5);
  const left = eL.clone().sub(eR); left.addScaledVector(f, -left.dot(f)).normalize();
  const up = new THREE.Vector3().crossVectors(f, left);
  const s = HEAD.eyeGap / eR.distanceTo(eL);
  const straighten = new THREE.Matrix4().makeBasis(left, up, f).transpose();           // scan space -> upright head space
  const fix = new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(HEAD.pitch, HEAD.yaw, HEAD.roll, 'YXZ'));
  const world = new THREE.Matrix4().makeTranslation(headBone.matrixWorld.elements[12], HEAD.eyeY, HEAD.eyeZ)
    .multiply(fix).multiply(new THREE.Matrix4().makeScale(s, s, s)).multiply(straighten)
    .multiply(new THREE.Matrix4().makeTranslation(-mid.x, -mid.y, -mid.z));
  pivot.matrixAutoUpdate = false;
  pivot.matrix.copy(Q.get('mode') === 'head' ? world : bindHeadInv.clone().multiply(world));
  pivot.matrixWorldNeedsUpdate = true;
}
setHead({});
// The scan was exported with the head turned, bowed and leaning. That pose is the one we want, so give it
// back through the neck and head bones (tilt=0 keeps the head upright; values between scale the pose).
const TILT = +(Q.get('tilt') ?? 1);
if (TILT && Q.get('mode') !== 'head') {
  const f = new THREE.Vector3(...SCAN.forward).normalize(), left = new THREE.Vector3(...SCAN.eyeL).sub(new THREE.Vector3(...SCAN.eyeR));
  left.addScaledVector(f, -left.dot(f)).normalize();
  const pose = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(left, new THREE.Vector3().crossVectors(f, left), f));
  const turn = (b, t) => {                       // rotate a bone by a share of the pose, measured in world axes
    const W = new THREE.Quaternion().slerp(pose, t), P = b.parent.getWorldQuaternion(new THREE.Quaternion());
    b.quaternion.premultiply(P.clone().invert().multiply(W).multiply(P)); b.updateMatrixWorld(true);
  };
  turn(bone('Neck'), 0.4 * TILT); turn(headBone, 0.6 * TILT);
}
// The scan's neck is bent relative to its head, so it pokes out of the collar. Cut it off just below
// the chin and let the body's own neck run up into the jaw instead.
if (Q.get('neck') !== 'keep') {
  const f = new THREE.Vector3(...SCAN.forward).normalize(), eR = new THREE.Vector3(...SCAN.eyeR), eL = new THREE.Vector3(...SCAN.eyeL);
  const mid = eR.clone().add(eL).multiplyScalar(0.5), left = eL.clone().sub(eR); left.addScaledVector(f, -left.dot(f)).normalize();
  const up = new THREE.Vector3().crossVectors(f, left), gap = eR.distanceTo(eL), v = new THREE.Vector3();
  head.traverse(o => {
    if (!o.isMesh) return;
    const P = o.geometry.attributes.position, idx = o.geometry.index.array, h = new Float32Array(P.count);
    let chin = 0;
    for (let i = 0; i < P.count; i++) {
      v.fromBufferAttribute(P, i).sub(mid); h[i] = v.dot(up);
      if (v.dot(f) > -0.15 * gap && Math.abs(v.dot(left)) < 0.3 * gap) chin = Math.min(chin, h[i]);
    }
    const cut = chin - NECK_KEEP * gap, keep = [];
    for (let i = 0; i < idx.length; i += 3) if (Math.max(h[idx[i]], h[idx[i + 1]], h[idx[i + 2]]) > cut) keep.push(idx[i], idx[i + 1], idx[i + 2]);
    o.geometry.setIndex(keep);
    console.log('INFO chin', (chin / gap).toFixed(3));
  });
}

// ---- hair: grown in code on the scalp of the bald scan
let hair = null;
if (HEAD_SRC === 'bald' && HAIR === 'code') {
  const f = new THREE.Vector3(...SCAN.forward).normalize(), eR = new THREE.Vector3(...SCAN.eyeR), eL = new THREE.Vector3(...SCAN.eyeL);
  const mid = eR.clone().add(eL).multiplyScalar(0.5), left = eL.clone().sub(eR); left.addScaledVector(f, -left.dot(f)).normalize();
  const up = new THREE.Vector3().crossVectors(f, left);
  let headMesh; head.traverse(o => { if (o.isMesh) headMesh = o; });
  hair = buildHair(THREE, headMesh, { mid, left, up, f, gap: eR.distanceTo(eL) }, window.__hairOpts || {});
  pivot.add(hair.group);
  console.log('INFO hair triangles', hair.triangles);
}

// ---- hair: a separate wig shell, placed in bind-pose world units and carried by the head bone
const wig = new THREE.Group(), WIG = { s: 0.226, sx: 0.95, sz: 1, x: 0.002, y: 0.814, z: 0, pitch: 0 };
function setWig(o) {
  Object.assign(WIG, o);
  const world = new THREE.Matrix4().makeTranslation(WIG.x, WIG.y, WIG.z).multiply(new THREE.Matrix4().makeRotationX(WIG.pitch)).multiply(new THREE.Matrix4().makeScale(WIG.s * WIG.sx, WIG.s, WIG.s * WIG.sz));
  wig.matrixAutoUpdate = false; wig.matrix.copy(bindHeadInv.clone().multiply(world)); wig.matrixWorldNeedsUpdate = true;
}
if (wigG) {
  wigG.scene.traverse(o => { if (o.isMesh) o.material = new THREE.MeshStandardMaterial({ color: 0x2a2226, roughness: 0.7, side: THREE.DoubleSide }); });
  wig.add(wigG.scene); setWig({}); headBone.add(wig);
}
{
  const eR = new THREE.Vector3(...SCAN.eyeR), eL = new THREE.Vector3(...SCAN.eyeL);
  head.traverse(o => { if (o.isMesh) look.dress(o, { eyes: [eR, eL], root: head }); });
  look.dress(skinned, {});
  if (wigG) wig.traverse(o => { if (o.isMesh) look.dress(o, {}); });
}
if (Q.get('mode') === 'head') { scene.remove(body); scene.add(pivot); } else if (Q.get('mode') !== 'body') headBone.add(pivot);

function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); look.resize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const box = new THREE.Box3().setFromObject(Q.get('mode') === 'head' ? pivot : body), ctr = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
function view(az = 0, el = 0.05, dist = size.y * 2.4, t = [ctr.x, ctr.y, ctr.z]) {
  controls.target.set(...t);
  camera.position.set(t[0] + dist * Math.sin(az) * Math.cos(el), t[1] + dist * Math.sin(el), t[2] + dist * Math.cos(az) * Math.cos(el));
  controls.update(); scene.updateMatrixWorld(true); camera.updateMatrixWorld(true); if (hair) hair.update(0, camera, sun.position); look.render();
}
view();
const clock = new THREE.Clock();
const ui = { look: Q.get('look') !== 'flat', glow: Q.get('glow') === '1', spark: Q.get('spark') !== '0', spin: Q.get('spin') === '1' };
function sync() {
  look.set(ui); controls.autoRotate = ui.spin;
  for (const k in ui) document.getElementById('b-' + k).setAttribute('aria-pressed', ui[k]);
}
for (const k in ui) document.getElementById('b-' + k).onclick = () => { ui[k] = !ui[k]; sync(); };
controls.autoRotateSpeed = 4; sync();
renderer.setAnimationLoop(() => { const t = clock.getElapsedTime(); controls.update(); if (hair && !window.__freeze) hair.update(t, camera, sun.position); look.render(window.__freeze ? 0 : t); });
const wp = b => b.getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(3));
console.log('INFO', JSON.stringify({ box: [box.min.toArray(), box.max.toArray()].map(a => a.map(v => +v.toFixed(3))), head: wp(headBone), neck: wp(bone('Neck')), hips: wp(bone('Hips')) }));
Object.assign(window, { __look: o => { Object.assign(ui, o); sync(); }, look, __view: view, __setHead: setHead, __setWig: setWig, wig, __ready: true, THREE, scene, camera, pivot, body, headBone });
</script>
</html>
